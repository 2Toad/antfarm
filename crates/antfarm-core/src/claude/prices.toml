# List prices per Claude model, used to price per-message usage.
#
# Source: https://platform.claude.com/docs/en/about-claude/pricing (sections "Model pricing"
# and "Long context pricing") and https://platform.claude.com/docs/en/build-with-claude/context-windows
# (section "Context window sizes by model"), both fetched 2026-11-02. Prices are USD per
# million tokens; context_window is in tokens.
#
# Lookup is by longest matching prefix of the model id, so a dated id such as
# claude-haiku-4-5-20251001 matches claude-haiku-4-5, and claude-opus-5-5 wins over
# claude-opus-5. A `[1m]` suffix (Claude Code's 1M context marker) is stripped first.
#
# `long_prompt_tokens` and `long` describe a second price tier for requests whose prompt
# (input + cache read + cache write) exceeds the threshold. Only Haiku 5.5 has one; the
# other 1M window models bill the whole window at the standard rate.

[[model]]
prefix = "claude-fable-5-1"
input = 10.0
output = 50.0
cache_read = 0.25
cache_write_5m = 12.5
cache_write_1h = 20.0
context_window = 1000000

